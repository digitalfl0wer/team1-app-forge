modules:
  jira:globalPage:
    - key: todo-list-hello-world-global-page
      resource: frame
      layout: blank
      resolver:
        function: resolver
      title: Todo-list
      icon: resource:icons;icon.svg
  scheduledTrigger:
    - key: run-schema-migration-trigger
      function: runSchemaMigration
      interval: hour
  webtrigger:
    - key: run-schema-migration-webtrigger
      function: runSchemaMigration
      response:
        type: dynamic
  function:
    - key: resolver
      handler: index.handler
    - key: runSchemaMigration
      handler: index.runSchemaMigration
  sql:
    - key: main
      engine: mysql
resources:
  - key: frame
    path: src/frame/build
    tunnel:
      port: 3000
  - key: icons
    path: icons
permissions:
  content:
    styles:
      - "unsafe-inline"
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/aaa0d6d7-d093-4ef6-b07f-deaa154cb0ad
