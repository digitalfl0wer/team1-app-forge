modules:
  jira:globalPage:
    - key: todo-list-hello-world-global-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: Todo-list
  scheduledTrigger:
    - key: run-schema-migration-trigger
      function: runSchemaMigration
      interval: hour
  webtrigger:
    - key: run-schema-migration-webtrigger
      function: runSchemaMigration
      response:
        type: dynamic
  sql:
    - key: main
      engine: mysql
  function:
    - key: resolver
      handler: index.handler
    - key: runSchemaMigration
      handler: index.runSchemaMigration
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/aaa0d6d7-d093-4ef6-b07f-deaa154cb0ad
