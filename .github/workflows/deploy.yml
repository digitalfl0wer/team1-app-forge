name: Deploy to Forge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Forge CLI
        run: npm install -g @forge/cli

      - name: Disable Forge usage analytics prompt
        run: forge settings set usage-analytics false

      - name: Install dependencies
        run: |
          npm install
          npm ci --prefix src/frame

      - name: Build frame and deploy
        run: npm run deploy -- --non-interactive -e development
